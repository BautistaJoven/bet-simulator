// PD = puntos por día que gana un jugador medio con las cartas actuales (12 cartas, 5 jugadas y bonificaciones buenas y malas).
// La deuda y las cuotas se calculan a partir de PD para que sigan el ritmo del juego.
const PD=63,DEUDA=PD*14;
const dm=()=>({f:.8,n:1,d:1.25})[(S.mode&&S.diff)||ST.diff||'n'];
const DEU=()=>Math.round(DEUDA*dm()/5)*5;
const cuota=d=>Math.round((d<=3?[20,40,50][d-1]:50+(PD/6)*(d-3))*dm()/5)*5;
const due=()=>S.paid?0:cuota(S.day)+(S.owed||0);
const fmt=v=>(v>0?'+':v<0?'−':'')+Math.abs(v);

const saveBest=n=>{try{if(n>best())localStorage.setItem('dc_best_'+(ST.diff||'n'),n)}catch(e){}};

const used=()=>S.queue.reduce((a,i)=>a+cost(S.hand[i]),0);
const hs=()=>12+(S.items.moc?2:0)+(S.items.mng?1:0);
const xv=c=>Math.max(0,c.v-(S.items.sal?5:0));
const tv=c=>S.rule.id=='lk'?Math.abs(c.v):S.rule.id=='ml'?-Math.abs(c.v):c.v;
const ksg=()=>S.items.det||S.rule.id=='lk'||S.rule.id=='ml';
const tq=c=>S.items.lup?fmt(tv(c)):ksg()?(tv(c)>0?'+?':'−?'):'?';
const eu=()=>(S.rule.id=='ep'?10:S.rule.id=='ea'?3:6)+(S.items.calc?2:0);
const pr=it=>Math.round(it.p*(S.rule.id=='desc'?.8:S.rule.id=='inf'?1.2:1)/5)*5;

function gen(){
  const s=S.deck=='s',k=s?[44,8,8,12,6,4,3,4,0,3,3,1,4]:[25,7,7,28,14,3,3,3,0,2,2,3,3];
  if(S.items.con)k[3]+=6;
  let r=rnd(1,k.reduce((a,b)=>a+b)),i=0;
  while(r>k[i]){r-=k[i];i++}
  const c=pick(['r','a','v']);
  if(i==0)return{k:'b',c,v:s?r5(5,15):r5(10,35)};
  if(i==1)return{k:'m',c};
  if(i==2)return{k:'e',c};
  if(i==3)return{k:'x',c,v:s?r5(5,10):r5(10,25)};
  if(i==5)return{k:'p',c};if(i==6)return{k:'l',c};if(i==7)return{k:'s',c};if(i==8)return{k:'z',c};
  if(i==9)return{k:'bk',c};if(i==10)return{k:'rl',c,v:s?r5(5,15):r5(10,20)};if(i==11)return{k:'pg',c};if(i==12)return{k:'cd',v:r5(5,10)};
  const h=s?r5(15,25):r5(30,50);
  return{k:'t',c,v:Math.random()<(S.items.tre?.6:(s?.5:.4))?h:-h};
}
function ensureZ(h){
  if(h.some(c=>c.k=='z'))return h;
  const ix=h.map((c,i)=>i).filter(i=>!h[i].dr);
  h[ix.length?pick(ix):h.length-1]={k:'z',c:pick(['r','a','v'])};
  return h;
}
function mkHand(){
  const h=[];
  if(S.drawer){S.drawer.dr=1;h.push(S.drawer);S.drawer=null}
  while(h.length<hs())h.push(gen());
  return ensureZ(h);
}
const lab0=c=>c.k=='cd'?fmt(c.v)+' '+(c.c?COL[c.c][0]:'★'):c.k=='bk'?'Banco':c.k=='rl'?'Reloj '+fmt(c.v):c.k=='pg'?'Purga':c.k=='b'?fmt(c.v)+' '+COL[c.c][0]:c.k=='m'?'×2':c.k=='p'?'Espejo':c.k=='l'?'Ladrón':c.k=='s'?'Seguro':c.k=='z'?'Racha':c.k=='e'?'Eco '+COL[c.c][0]:c.k=='x'?'−'+xv(c):tq(c)+' '+COL[c.c][0];

const lab=c=>lab0(c)+((c.c&&!['b','e','t','cd'].includes(c.k))?' '+COL[c.c][0]:'');
const slotTxt=c=>{const k=c.k;return (k=='b'||k=='cd'||k=='rl')?fmt(c.v):k=='x'?'−'+xv(c):k=='t'?tq(c):k=='e'?'+'+eu():k=='z'?'+'+(S.items.cale?5:3)*(S.rch+1):k=='m'?'×2':''};
function scoreRaw(q,det){
  let tot=0,pend=false,L=[],prev=null,last=0,carry=0,guard=0,run=0,win=[],par=!!S.items.par,bank=0,purge=q.some(c=>c.k=='pg');
  const brk=()=>{prev=null;run=0;win=[]};
  const chain=c=>{
    if(!c.c){brk();return}
    if(prev&&prev.c==c.c){run++;const b=S.rule.id=='sc'?0:(S.rule.id=='cb'?20:5)+(S.items.peg?5:0);tot+=b;if(b)L.push(`Combo de mismo color → +${b}`);if(run==3&&S.items.tri){tot+=20;L.push('Trío → +20')}}else run=1;
    win.push(c.c);if(win.length>3)win.shift();
    if(win.length==3&&new Set(win).size==3){tot+=15;L.push('Arcoíris → +15');win=[]}
    prev=c;
  };
  q.forEach((c,i)=>{
    let v=0,t='',flip=false;
    if(c.k=='m'){pend=true;guard=0;last=0;L.push(`${i+1}. ×2 → duplica la siguiente`);if(!S.items.cin)chain(c);return}
    if(c.k=='s'){guard=S.items.cer?2:1;last=0;L.push(`${i+1}. Seguro → ${S.items.cer?'las 2 siguientes, si son malditas o trampas, suman':'la siguiente, si es maldita o trampa, suma'} en positivo`);chain(c);return}
    if(c.k=='l'){guard=0;const st=last>0?Math.floor(last*(S.items.gua?2/3:1/2)):0;tot-=st;carry+=st;last=0;L.push(`${i+1}. Ladrón → roba ${st} de la anterior`);chain(c);return}
    if(c.k=='bk'){guard=0;const st=last>0?last:0;tot-=st;bank+=st*2;last=0;L.push(`${i+1}. Banco → guarda ${st} de la anterior; mañana recibes ${st*2}`);chain(c);return}
    if(c.k=='pg'){guard=0;last=0;L.push(`${i+1}. Purga → descarta todas las malditas`);chain(c);return}
    if(guard>0){if(c.k=='x'||c.k=='t'){flip=true;guard--}else guard=0}
    if(c.k=='rl'){v=c.v;if(i==q.length-1){v*=3;t=' (reloj: ×3 por ser la última)'}}
    if(c.k=='p'){v=last+(S.items.fot?5:0);t=S.items.fot?' (copia a la anterior, +5 foto)':' (copia a la anterior)'}
    if(c.k=='z'){const u=S.items.cale?5:3;v=u*(S.rch+1);t=` (racha de ${S.rch+1} día${S.rch?'s':''})`}
    if(c.k=='b'||c.k=='cd'){v=c.v;
      if((S.rule.id=='r2'&&c.c=='r')||(S.rule.id=='a2'&&c.c=='a')){v*=2;t=' (bonificación del día)'}
      if(S.rule.id=='v10'&&c.c=='v'){v+=10;t=' (bonificación del día)'}
      if((S.rule.id=='r5'&&c.c=='r')||(S.rule.id=='a5'&&c.c=='a')){v=Math.round(v/2);t=' (bonificación del día)'}
      if(S.rule.id=='vm'&&c.c=='v'){v-=10;t=' (bonificación del día)'}
      if(S.rule.id=='llu'){v+=5;t=' (bonificación del día)'}
      if(S.rule.id=='seq'){v=Math.max(0,v-5);t=' (bonificación del día)'}}
    if(c.k=='e'){const u=eu();v=u*i;t=` (${u} por cada carta antes)`}
    if(c.k=='x'){
      if(purge){v=0;t=' (purgada)'}
      else if(flip){v=xv(c);t=' (Seguro: ahora suma)'}
      else if(S.rule.id=='nc'){v=0;t=' (hoy no resta)'}
      else if(par){v=0;par=false;t=' (pararrayos)'}
      else{v=-xv(c)*(S.rule.id=='nd'?2:1);if(S.items.amu){v=Math.ceil(v/2);t=' (amuleto)'}}
      if(S.items.cen&&!purge){v+=5;t+=' (+5 cenizas)'}}
    if(c.k=='t'){if(flip){v=Math.abs(c.v);t=' (Seguro: ahora suma)'}else{v=tv(c);t=' (trampa revelada)'}}
    if(pend){v*=2;pend=false;t+=' ×2'}
    if(S.items.tre4&&v>0&&!det&&Math.random()<.1){v*=2;t+=' 🍀 doble'}
    if(i==q.length-1){if(S.rule.id=='gf'){v*=2;t+=' (gran final ×2)'}if(S.rule.id=='fr'){v=0;t=' (último fracaso)'}}
    if(carry){v+=carry;t+=` (+${carry} del ladrón)`;carry=0}
    tot+=v;last=v;
    L.push(`${i+1}. ${lab(c)} → ${fmt(v)}${t}`);
    chain(c);
  });
  return{tot,L,bank};
}
function score(q){
  const w=[];q.forEach((c,i)=>{if(c.k=='cd')w.push(i)});
  if(!w.length)return scoreRaw(q);
  let best=q,bt=-1e9;const cols=['r','a','v'];
  for(let m=0;m<Math.pow(3,w.length);m++){
    const q2=q.slice();let mm=m;
    w.forEach(i=>{q2[i]={...q[i],c:cols[mm%3]};mm=Math.floor(mm/3)});
    const r=scoreRaw(q2,true);
    if(r.tot>bt){bt=r.tot;best=q2}
  }
  return scoreRaw(best);
}
function calc(q,hand){
  const R0=score(q.map(i=>hand[i])),L=R0.L;let tot=R0.tot;
  if(S.items.imn){const ub=hand.filter((c,i)=>!q.includes(i)&&c.k=='b').map(c=>c.v);if(ub.length){const mm=Math.max(...ub);tot+=mm;L.push(`Imán → +${mm} (la carta más alta sin jugar)`)}}
  const lc=hand.filter((c,i)=>!q.includes(i)&&c.k=='x');
  const purged=q.some(i=>hand[i].k=='pg');
  const pen=(S.rule.id=='nc'||purged)?0:lc.reduce((a,c)=>a+(xv(c)+(S.items.umb?0:10))*(S.rule.id=='nd'?2:1),0);
  return{L,tot,pen,left:lc.length,bank:R0.bank};
}

function card(c,i,sel){
  const k=c.k,u=S.items.cale?5:3;
  const T={
    b:['+'+c.v,'Ganancia','suma puntos'],
    e:['+'+eu(),'Eco','por cada carta jugada antes'],
    x:['−'+xv(c),'Maldita','resta si la juegas'],
    t:[tq(c),'Trampa','suma o resta'],
    m:['×2','Doble','duplica la siguiente'],
    z:['+'+u*(S.rch+1),'Racha','+'+u+' por cada día seguido ('+(S.rch+1)+')'],
    rl:['+'+c.v,'Reloj','triple si es tu última carta'],
    cd:['+'+c.v,'Comodín','toma el mejor color'],
    p:[null,'Espejo','copia a la anterior'],
    l:[null,'Ladrón','la mitad de la anterior pasa a la siguiente'],
    s:[null,'Seguro','la maldita o trampa que sigue suma en positivo'],
    bk:[null,'Banco','guarda la anterior; mañana te da el doble'],
    pg:[null,'Purga','sin malditas; gasta 3 jugadas']}[k];
  const ex=k=='t'&&ksg()?(tv(c)>0?' g':' bd'):'';
  const body=T[0]!==null?`<b class="v">${T[0]}</b><span class="nm">${T[1]}</span>`:`<b class="v nn">${T[1]}</b>`;
  return `<button class="card cx k-${k} s-${c.c||'w'}${ex}${sel?' sel':''}" aria-label="${T[1]} ${T[0]||''} ${c.c?COL[c.c][1]:'comodín'}" onclick="tap(${i})"><span class="r1"><i class="chip">${c.c?COL[c.c][0]:'★'}</i><i class="gl">${CI[k]}</i></span>${body}<span class="d">${T[2]}</span></button>`;
}

const rulesB=()=>`<div class="box"><b>Cómo se juega</b>

function showInfo(id){S.info=id;rr()}
function choose(el,fn){if(el.dataset.p)return;el.dataset.p=1;el.classList.add('pick');setTimeout(fn,280)}
function menu(){S={phase:'menu'};render()}
function start(m){S={mode:m,day:1,pts:10,debt:DEU(),max:15,diff:ST.diff,items:{},rch:0,rm:0,owed:0};newDay()}
function newDay(m){
  S.rule=S.nxt||pickRule();S.nxt=pickRule();if(S.day>1)sfx('day');
  S.paid=false;S.dn=0;S.cajUsed=false;S.tijUsed=false;S.camUsed=false;S.act=null;
  let msg=m||'';
  if(S.items.alc){S.pts+=10;msg+=(msg?' ':'')+'Alcancía: +10 puntos.'}
  if(S.bank){S.pts+=S.bank;msg+=(msg?' ':'')+`Banco: +${S.bank} puntos.`;S.bank=0}
  S.phase='deck';S.queue=[];S.hand=[];S.res=null;S.msg=msg;render();S.msg='';
}
function deal(d){S.deck=d;S.hand=mkHand();S.queue=[];S.phase='play';render()}
function swapRule(){
  if(S.camUsed)return;S.camUsed=true;
  let r;do{r=pickRule()}while(r.id==S.rule.id);
  S.rule=r;while(S.queue.length&&used()>mx())S.queue.pop();rr();
}
function setAct(a){S.act=S.act==a?null:a;rr()}
function tap(i){
  if(S.act)return act(i);
  const k=S.queue.indexOf(i),full=k<0&&used()+cost(S.hand[i])>mx();
  sfx(full?'no':'tap');
  if(k>=0)S.queue.splice(k,1);else if(!full)S.queue.push(i);
  rr();
  const cards=A.querySelectorAll('.card');
  if(full){cards[i]&&cards[i].classList.add('shake')}
  else if(k<0){const sl=A.querySelectorAll('button.slot')[S.queue.length-1];sl&&sl.classList.add('slotin')}
  else{cards[i]&&cards[i].classList.add('bump')}
}
function act(i){
  const c=S.hand[i],no=S.queue.includes(i)||(S.act=='caj'&&c.k=='x');
  if(no){const el=A.querySelectorAll('.card')[i];el&&el.classList.add('shake');return}
  if(S.act=='caj'){S.hand.splice(i,1);S.queue=S.queue.map(j=>j>i?j-1:j);delete c.dr;S.drawer=c;S.cajUsed=true;S.act=null;rr()}
  else{S.hand[i]=gen();S.tijUsed=true;S.act=null;rr();const el=A.querySelectorAll('.card')[i];el&&el.classList.add('bump')}
}
function dice(){
  S.dn++;
  const h=S.hand.filter(c=>c.dr),t=hs()-(S.cajUsed?1:0);
  while(h.length<t)h.push(gen());
  ensureZ(h);S.hand=h;S.queue=[];rr();
}
function resolve(){
  const R=calc(S.queue,S.hand),q=S.queue.map(i=>S.hand[i]);
  S.bank=(S.bank||0)+R.bank;
  if(q.some(c=>c.k=='z')){S.rch++;S.rm=0}else{S.rm++;if(S.rm>(S.items.pgt?1:0)){S.rch=0;S.rm=0}}
  S.pts=Math.max(0,S.pts+R.tot-R.pen);
  S.res=R;S.phase='res';afterRes(R,q);render();
}
function toShop(){
  const av=ITEMS.filter(i=>!S.items[i.id]&&(!i.req||S.items[i.req])&&(i.id!='hor'||BAD.length));
  const sh=av.slice().sort(()=>Math.random()-.5).slice(0,S.items.llv?5:3);
  if(sh.length&&!sh.some(i=>pr(i)<=S.pts)){
    const ok=av.filter(i=>pr(i)<=S.pts);
    if(ok.length)sh[sh.length-1]=pick(ok);
    else{const ch=av.slice().sort((a,b)=>pr(a)-pr(b))[0];if(!sh.includes(ch))sh[sh.length-1]=ch}
  }
  S.shop=sh;S.phase='shop';render();
}
function buyA(el,id){
  const it=ITEMS.find(x=>x.id==id);
  if(S.pts<pr(it)||el.dataset.b)return;
  el.dataset.b=1;el.classList.add('bought');
  const pe=el.querySelector('.price');if(pe)pe.textContent='✓';
  setTimeout(()=>buy(id),720);
}
function buy(id){
  const it=ITEMS.find(x=>x.id==id);
  if(S.pts<pr(it))return;
  S.pts-=pr(it);S.items[id]=true;sfx('buy');stats.items++;if(Object.keys(S.items).length>=8)ach('col');LS.set('dc_stats',stats);if(id=='con')S.pts+=100;
  S.shop=S.shop.filter(x=>x.id!=id);
  rr();
  const b=A.querySelector('.stats div:nth-child(2) b');if(b)b.classList.add('tick');
  const idx=ITEMS.filter(x=>S.items[x.id]).findIndex(x=>x.id==id),m=A.querySelectorAll('.mine .ico');
  if(m[idx])m[idx].classList.add('ipop');
}
function payToday(){
  const c=due();if(c<=0||S.pts<c)return;
  S.pts-=c;S.owed=0;S.paid=true;rr();
  const b=A.querySelector('.stats div:nth-child(2) b');if(b)b.classList.add('tick');
}
function pay(n){
  n=Math.min(n,S.pts,S.debt);S.pts-=n;S.debt-=n;
  if(S.debt<=0){S.phase='win';onEnd(true)}
  render();
}
function endDay(){
  let m='',tm='';
  if(S.rule.id=='imp'){const tx=Math.min(20,S.pts);S.pts-=tx;tm=`Impuesto: −${tx} puntos. `}
  if(S.mode=='i'){
    const c=due();
    if(S.pts<c){
      if(S.items.tar&&!S.tarUsed){S.tarUsed=true;S.owed=c;m='Tarjeta de crédito: la cuota se aplazó y se suma a la de hoy.';saveBest(S.day);S.day++}
      else{saveBest(S.day-1);lose();return}
    }else{S.pts-=c;S.owed=0;saveBest(S.day);S.day++;if(S.day>10)ach('s10')}
  }else{
    if(S.day%5==0&&S.debt>0){
      if(S.items.tar&&!S.tarUsed){S.tarUsed=true;m='Tarjeta de crédito: evitaste los intereses.'}
      else{S.debt=Math.round(S.debt*1.1/5)*5;m='Intereses: la deuda subió 10%.'}
    }
    S.day++;
    if(S.day>S.max&&S.debt>0){lose();return}
  }
  if(S.items.int){const gn=Math.floor(S.pts*.05);if(gn>0){S.pts+=gn;m+=(m?' ':'')+`Intereses: +${gn} puntos.`}}
  newDay(tm+m);
}

    return back()+`<h1>Ajustes</h1><div class="group">${sw('snd','Sonido')}${sw('vib','Vibración')}</div><div class="sec">Tema</div><div class="group">${seg('theme',[['a','Automático'],['light','Claro'],['dark','Oscuro']])}</div><div class="sec">Dificultad</div><div class="group">${seg('diff',[['f','Fácil'],['n','Normal'],['d','Difícil']])}</div><div class="pill" style="margin-top:8px">Cambia la deuda y las cuotas de las partidas nuevas.</div><div class="group" style="margin-top:14px"><button class="row" onclick="go('tut')"><span class="t"><b>Ver tutorial</b></span><span class="chev">›</span></button><button class="row" onclick="wipe()"><span class="t"><b style="color:var(--red)">${S.wp?'Toca de nuevo para borrar todo':'Borrar datos y logros'}</b></span></button></div><div class="pill" style="margin-top:14px">En iPhone: Compartir → Añadir a pantalla de inicio. En computadora: 1-9 eligen carta, Enter confirma, Esc abre el menú.</div>`}
  if(p=='stats'){const r=(a,b)=>`<div class="row"><span class="t"><b>${a}</b></span><span class="sub">${b}</span></div>`;
    return back()+`<h1>Logros</h1><div class="group">${r('Partidas',stats.g)}${r('Victorias',stats.w)}${r('Derrotas',stats.l)}${r('Récord en Sin Fondo',best()+' días')}${r('Objetos comprados',stats.items)}</div><div class="sec">Logros</div><div class="group">${Object.entries(ACH).map(([k,v])=>`<div class="row"><span class="ico" style="background:${stats.ach[k]?'var(--green)':'#8e8e93'}">${stats.ach[k]?SV.ok:SV.no}</span><span class="t"><b>${v[0]}</b><small>${v[1]}</small></span></div>`).join('')}</div>`}
  const ex=[{k:'b',c:'r',v:15},{k:'x',c:'a',v:15},{k:'t',c:'v',v:-20},{k:'m',c:'r'},{k:'e',c:'a'},{k:'p',c:'v'},{k:'l',c:'r'},{k:'s',c:'a'},{k:'z',c:'v'},{k:'bk',c:'r'},{k:'rl',c:'a',v:15},{k:'pg',c:'v'},{k:'cd',v:10}];
  return back()+`<h1>Guía</h1><div class="hand">${ex.map((c,i)=>card(c,i).replace(/ onclick="[^"]*"/,'')).join('')}</div><div class="group">${TUT.map(t=>`<div class="line"><b>${t[0]}.</b> ${t[1]}</div>`).join('')}</div>`
}
document.addEventListener('keydown',e=>{const p=S.phase;
  if(e.key=='Escape'&&['deck','play','res','shop'].includes(p)){S.ask=!S.ask;rr();return}
  if(S.ask||S.info)return;
  if(p=='play'){if(/^[1-9]$/.test(e.key)&&S.hand[+e.key-1])tap(+e.key-1);else if(e.key=='0'&&S.hand[9])tap(9);else if(e.key=='Enter')resolve()}
  else if(p=='deck'){if(e.key=='1')deal('s');if(e.key=='2')deal('r')}
  else if(p=='res'&&e.key=='Enter')toShop();else if(p=='shop'&&e.key=='Enter')endDay()});
function boot(){applyTheme();if(!LS.get('dc_tut'))go('tut');else menu()}
boot();
</script>
